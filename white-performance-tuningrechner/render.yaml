services:
  - type: web
    name: white-performance-tuningrechner
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: white-performance-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: white-performance-uploads
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: white-performance-db
    plan: basic-256mb
    databaseName: whiteperformance
    user: wpadmin
